#cloud-config
# NVA (network virtual appliance) for the routing lab.
# Turns this VM into a router: forwards packets between interfaces and
# NATs outbound traffic. Applied at first boot via a systemd oneshot, so
# the rules survive a reboot without any package installs.
write_files:
  - path: /usr/local/bin/nva-setup.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # Enable IPv4 forwarding and NAT all forwarded traffic out eth0.
      # Idempotent: checks each rule before adding it.
      sysctl -w net.ipv4.ip_forward=1
      iptables -t nat -C POSTROUTING -o eth0 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
      iptables -C FORWARD -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -A FORWARD -m state --state RELATED,ESTABLISHED -j ACCEPT
      iptables -C FORWARD -i eth0 -o eth0 -j ACCEPT 2>/dev/null || iptables -A FORWARD -i eth0 -o eth0 -j ACCEPT
  - path: /etc/sysctl.d/99-nva.conf
    content: |
      net.ipv4.ip_forward=1
  - path: /etc/systemd/system/nva-firewall.service
    content: |
      [Unit]
      Description=Apply NVA forwarding and NAT rules
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/nva-setup.sh
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
runcmd:
  - sysctl -p /etc/sysctl.d/99-nva.conf
  - systemctl enable --now nva-firewall.service
